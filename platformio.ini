; ─────────────────────────────────────────────────────────────────────────────
;  Cavli C16QS GSM/LTE — AT-komut örneği  (HEDEF: LTE-Bridge, ESP32-C3)
;  ESP32-C3 + Arduino framework. Tek dosya: src/main.cpp
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
